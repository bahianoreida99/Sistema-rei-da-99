name: Validar sistema
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run build
      - run: npm run build:api
      - run: npm test
      - run: npm run test:automation:100
      - run: npm run test:documents
